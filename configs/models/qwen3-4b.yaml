notes: >-
  DECIDED 2026-09-16 as the v0 candidate for the sell-to-clients path (docs/evaluation-review.md §6). Reasons, in
  order: (1) cost per turn is the commercial constraint, and the economics are volume-gated — a 4B on a 10 GB
  card moves break-even volume down ~2x versus the 8B on an L40S; (2) the data budget is ~1.2k rows, so a 4B is
  the better parameter-to-data ratio for SFT; (3) the same Qwen3 chat template and hermes tool parser means every
  config, prompt and eval transfers unchanged. Same family language claims as the 8B, but treat them as unproven
  until ZaraBench language slices say otherwise. NOT a replacement for the 8B where capability matters more than
  volume (the compiler task) — that stays on qwen3-8b, with qwen3-14b as the scale-up.
