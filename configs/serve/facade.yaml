# Protea inference facade: what aria's runtime (MIAI_MODEL_GATEWAY_URL) and the Zara routes talk to.
backend: protea               # vLLM via PROTEA_INFERENCE_URL; use `mock` for local checks
served_model: protea-agent
aliases: [protea, protea-agent-0.1]
host: 0.0.0.0
port: 8080
require_token: true           # PROTEA_FACADE_TOKEN
ready_ttl_s: 15
drain_timeout_s: 30
max_repairs: 1
workers: 1

# ADR-017: v0 is the frozen base + the guardrail prompt, so the product framing is part of the deployment,
# not something each caller has to remember. The file wins over an inline `system_prompt`. `serve facade
# --check` prints the resolved char count before you deploy, and the prompt is merged above any per-agent
# system message the caller sends (so a marketplace agent's own instructions still apply underneath).
system_prompt_file: configs/evaluation/guardrail-system-prompt.md

# Per-tenant ceiling across /v1/*, in-process per replica (serving/ratelimit.py). This is a blast-radius
# limit, not a billing quota: it stops one caller consuming the engine. Tune it from `serve loadtest` on the
# real GPU before a partner routes production traffic here.
rate_limit_rpm: 600
rate_limit_burst: 60

# Tool-permission guard (serving/guard.py): applied to every model response, self-hosted or frontier.
# Denied patterns never reach a tool runtime whatever the model was told; limits turn an over-limit call
# into an escalation; confidential system-prompt lines never come back out.
tool_policy:
  deny: ["delete_*", "*_delete", "transfer_*", "admin_*", "*_admin"]
  limits:
    issue_refund: {field: amount_zar, max: 100}
  escalation_tool: handoff_to_human
  refusal: "I can't do that from here. A colleague can help with that request."
  unknown_tool_retries: 1
  confidential_markers: ["[internal]", "[confidential]", "staff only"]
