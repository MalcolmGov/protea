# 48GB alternative to the A100 target: one L40S on RunPod secure cloud. Fits the QLoRA-8B job, and is both
# cheaper and faster than the A6000 (Ada vs Ampere) — see configs/pricing/gpu.yaml. Use whichever 48GB card
# RunPod has capacity for. Everything else matches runpod-a100.yaml.
provider: runpod
gpu: l40s
gpu_count: 1
image: ghcr.io/malcolmgov/protea-train:latest
spot: false
# Checkpoints and the trained adapter sync to Cloudflare R2 (S3-compatible), so they outlive the disposable pod.
# The launcher fills in your bucket/endpoint; the R2 access key/secret go in PROTEA_STORAGE_CREDENTIALS at launch.
storage:
  kind: s3
  uri: s3://YOUR_R2_BUCKET/agent-training
  endpoint: https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
checkpoint_sync_minutes: 10
runpod: {cloud_type: SECURE, volume_gb: 20, container_disk_gb: 50}
