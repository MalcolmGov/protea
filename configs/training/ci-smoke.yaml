# Offline CI smoke: a 2-layer random model and a tokenizer trained on the fixture text. Proves the trainer,
# the frozen config snapshot, checkpoint/resume, metrics logging and the model card without any download.
model:
  base_model: tiny-random
  load_in_4bit: false
training:
  method: lora
  epochs: 1
  max_steps: 6
  learning_rate: 5.0e-4
  max_sequence_length: 512
  per_device_batch_size: 2
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  bf16: false
  seed: 7
  logging_steps: 1
  save_steps: 3
  eval_steps: 3
lora:
  rank: 4
  alpha: 8
  dropout: 0.0
dataset:
  train: tests/fixtures/training/train.jsonl
  validation: tests/fixtures/training/validation.jsonl
  dataset_key: fixture-training-0.0.1
output:
  dir: checkpoints/ci-smoke
  experiment_name: ci-smoke
  model_family: protea-agent
budget:
  max_runtime_minutes: 10
  max_cost_usd: 0
