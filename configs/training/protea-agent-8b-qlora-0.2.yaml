# Second experiment: identical recipe to 0.1, trained on the leakage-safe 0.2 data WITH the reviewed synthetic
# tool_calling rows blended in (see docs/data-growth.md). The point is to measure whether that tool_calling
# volume lifts the adapter's ZaraBench score over 0.1 (which had zero tool_calling training). Same
# hyperparameters as 0.1 so the dataset is the only variable. Runs only on a rented GPU after an explicit
# --dry-run review, and self-scores via `train local --eval`.
model:
  base_model: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218   # same pinned commit as the B0 baseline (configs/models/qwen3-8b.yaml)
  trust_remote_code: false
  load_in_4bit: true
training:
  method: qlora
  epochs: 3
  learning_rate: 1.0e-4
  max_sequence_length: 6144
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  warmup_ratio: 0.03
  lr_scheduler: cosine
  seed: 42
  bf16: true
  save_steps: 100
  eval_steps: 100
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
dataset:
  # train.blended.jsonl = the 0.2 mined train split + reviewed synthetic tool_calling rows (`dataset blend`).
  # validation/test/golden stay the mined build's, so the eval hold-out is never diluted with synthetic data.
  train: protea_data/agent-training/0.2.0/train.blended.jsonl
  validation: protea_data/agent-training/0.2.0/validation.jsonl
  dataset_key: agent-training-0.2.0
output:
  dir: checkpoints/protea-agent-0.2
  experiment_name: protea-agent-0.2-qwen3-8b-qlora
  model_family: protea-agent
  tags: {base: qwen3-8b, method: qlora, data: "0.2-blended"}
budget:
  max_runtime_minutes: 300
  max_cost_usd: 40
  idle_shutdown_minutes: 15
  checkpoint_before_shutdown: true
