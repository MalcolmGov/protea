# CPU-only smoke run: proves the trainer, checkpoint/resume and config snapshot without a GPU.
model:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  trust_remote_code: false
  load_in_4bit: false
training:
  method: lora
  epochs: 1
  max_steps: 20
  learning_rate: 2.0e-4
  max_sequence_length: 1024
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  bf16: false
  seed: 42
  save_steps: 10
  eval_steps: 10
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
dataset:
  train: protea_data/agent-training/0.1.0/train.jsonl
  validation: protea_data/agent-training/0.1.0/validation.jsonl
  dataset_key: agent-training-0.1.0
  max_examples: 32
output:
  dir: checkpoints/dev-tiny
  experiment_name: dev-tiny-smoke
  model_family: protea-agent
budget:
  max_runtime_minutes: 20
  max_cost_usd: 0
