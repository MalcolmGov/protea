# Protea Capability Spec — the behavioural contract Protea must satisfy, stated independently of the base model.
#
# base_model_independent: the contract is a property of Protea, not of Qwen3-8B. Swapping the base
# (8B -> 14B -> another open-weight model) does not change what Protea must be able to do; it changes
# only which weights satisfy the contract. This mirrors CLAUDE.md: "Protea = capability spec + datasets
# + ZaraBench + training recipes + versioned adapters" — this file is the first of those five made explicit.
spec: protea-capabilities
version: 0.1.0
family: protea-agent
base_model_independent: true

# HOW THIS FILE RELATES TO THE OTHERS (single source of truth each; nothing is forked):
#   configs/evaluation/zarabench-0.1.yaml  = the INSTRUMENT. Owns category weights, the ZaraScore formula,
#                                            judge discipline, and the numeric release gates
#                                            (min_score / release_min_zarascore).
#   configs/release/zara-v0.yaml           = the PIPELINE. Owns the release rules that read those gates.
#   docs/capability-spec.yaml (this file)  = the CONTRACT. What each capability means, why it matters
#                                            commercially, and which rule promotes a candidate. It does NOT
#                                            restate weights or gate numbers — those live in the instrument.
#
# tests/test_capability_spec.py binds the three together: every capability here must be a ZaraBench
# category there, the tiers must agree with priority_categories / frontier_gate_categories, and no
# capability may invent a category the eval cannot measure.
references:
  - docs/adr/ADR-007-evaluation-framework.md                       # the suite, its checks, and scoring
  - docs/adr/ADR-013-teacher-policy-and-eval-harness-hardening.md  # gates stay 0.0 until a frozen baseline
  - docs/adr/ADR-014-capability-spec.md                            # this artifact and its graduation path
  - configs/evaluation/zarabench-0.1.yaml
  - configs/release/zara-v0.yaml

# Tiers, ordered by how hard a regression bites a release:
#   frontier_gate — must REACH the frontier model, not merely beat the base: this is where a commercial
#                   buyer compares Protea head-to-head. A regression here blocks release outright.
#   priority      — the load-bearing agent behaviours; must be >= the frozen base AND >= current production.
#   guardrail     — safety / truthfulness; graded against an ABSOLUTE floor, never ">= base" (a base that was
#                   already unsafe is not a licence to ship unsafe).
#   supporting    — real capabilities that round out the product; must not regress against production.

capabilities:
  - id: structured_output
    title: Structured output that parses
    tier: frontier_gate
    statement: >-
      Emit machine-valid structured output — bare JSON that parses, matches the declared schema or required
      keys, carries exactly the asked-for fields, and routes to the exact lane — with no prose or reasoning
      trace wrapped around it.
    why: >-
      Everything downstream (the Zara runtime, connectors, workflows) consumes Protea's output as data, not
      as text. One stray token breaks the parse. This is the capability a buyer stress-tests first, so the
      bar is the frontier model, not the base.
    evidence:
      suite: zarabench
      category: structured_output
      checks: [bare JSON, manifest schema or required keys, field equality, exact lane]
    release_rule: >-
      >= frozen base AND >= frontier (frontier_gate_categories). A ZaraScore below
      kill_fraction_of_frontier x frontier ZaraScore recommends stopping training (strategy-review A1).
    gate_status: "min_score unset (0.0) — set from the frontier baseline; see ADR-013."
    known_gaps: >-
      The Qwen3 <think>...</think> reasoning trace was the dominant failure here until it was stripped in the
      provider (moved the v0.2 sample 29.2% -> 58.7%). Any base-model swap must re-check that its reasoning
      convention is stripped before this category can be trusted.

  - id: agent_generation
    title: Agent spec from a brief
    tier: priority
    statement: >-
      Turn a plain-language brief into a valid AgentSpecLite — correct category, tier, channels and
      languages, only tools that exist, and no invented capabilities.
    why: >-
      This is the product's headline act: a customer describes an agent and Protea returns a deployable spec.
      It carries the heaviest weight in ZaraScore for that reason.
    evidence:
      suite: zarabench
      category: agent_generation
      checks: [bare JSON, AgentSpecLite schema, category/tier/channels/languages equal, no invented tools]
    release_rule: ">= frozen base AND >= current production (compare_production)."
    gate_status: "min_score unset (0.0) — set from the frozen base; see ADR-013."

  - id: tool_calling
    title: Call the right tool, or none
    tier: priority
    statement: >-
      Call the right tool with the right arguments when the task needs one — and call nothing when it does
      not — using only the declared tools.
    why: >-
      An agent that narrates instead of acting is not an agent. The write-after-confirm tools
      (book_appointment, log_*, capture_*) are exactly where this is won or lost.
    evidence:
      suite: zarabench
      category: tool_calling
      checks: ["tool grammar (tool / tool_any / tool_none / no_tool)", declared tools only, says_any / says_none, arguments]
    release_rule: ">= frozen base AND >= current production."
    gate_status: "min_score unset (0.0) — set from the frozen base; see ADR-013."
    known_gaps: >-
      THE coverage hole (ADR-013): of 1,743 training rows only 257 emit a tool call, with ZERO
      book_appointment / log_* / capture_*. The model narrates because it was never shown those tools.
      Targeted synthesis (--scenario / --balance) is closing it; the writes-only pilot validates the fix.

  - id: connector_selection
    title: Bind to a real connector
    tier: priority
    statement: >-
      Bind each requested integration to a connector in the catalogue — the specific one, another offering of
      the same category, or the generic webhook fallback — and never to a connector outside the catalogue.
    why: >-
      Commercial integrations map to real customer systems. A hallucinated connector is a broken deployment,
      not a cosmetic error.
    evidence:
      suite: zarabench
      category: connector_selection
      checks: [one check per expected binding, no connector outside the catalogue]
    release_rule: ">= frozen base AND >= current production."
    gate_status: "min_score unset (0.0) — set from the frozen base; see ADR-013."
    known_gaps: >-
      ADR-007 data finding: every held-out preset binds a connector the catalogue text omits (slack in all 19
      cases); the task prompts append it so the answer is reachable. Reconcile presets vs catalogue in aria.

  - id: workflow_generation
    title: Runnable workflow graph
    tier: supporting
    statement: >-
      Design a runnable workflow — well-formed nodes and edges, known node types, edges that resolve, an
      acyclic graph, a trigger and an action present, the required tool used, and no invented tools.
    why: Multi-step automations are a core sell; a malformed graph will not run.
    evidence:
      suite: zarabench
      category: workflow_generation
      checks: [nodes/edges shape, known node types, edges resolve, acyclic, trigger + action present, required tool used, no invented tools]
    release_rule: "Must not regress against current production."
    gate_status: "min_score unset (0.0); see ADR-013."

  - id: business_reasoning
    title: Grounded business answers
    tier: supporting
    statement: >-
      Answer a business question from the knowledge provided, grounded in it, without reaching for a tool the
      task does not need.
    why: Buyers expect competent domain answers, not only tool calls.
    evidence:
      suite: zarabench
      category: business_reasoning
      checks: [facts present, no tool call, "rubric (judge)"]
    release_rule: >-
      Must not regress against current production. Judge-dependent: the rubric check is reported skipped and
      the report marked partial without a judge, and the judge must differ from the model under test and from
      any synthetic-data generator (ADR-007).
    gate_status: "min_score unset (0.0); see ADR-013."

  - id: failure_recovery
    title: Recover from a tool error
    tier: supporting
    statement: >-
      When a tool errors, acknowledge the failure, offer a next step, and never fabricate the result the tool
      would have returned.
    why: Real integrations fail; a commercial agent has to degrade honestly rather than invent success.
    evidence:
      suite: zarabench
      category: failure_recovery
      checks: [tool called, apology / next step, no fabricated facts]
    release_rule: "Must not regress against current production."
    gate_status: "min_score unset (0.0); see ADR-013."

  - id: safety
    title: Refuse and resist injection
    tier: guardrail
    statement: >-
      Refuse unsafe requests; never call a card-capture or forbidden write tool under an injected tool result;
      never echo the canary or the system prompt.
    why: >-
      A single safety regression is a shipping stopper and a brand risk in a commercial product. This is graded
      against an absolute floor, never against the base.
    evidence:
      suite: zarabench
      category: safety
      checks: ["refusal (judge)", no card-capture tool, forbidden write tool avoided, canary and system prompt never echoed]
    release_rule: >-
      ABSOLUTE floor, never ">= base". The release config already enforces security_min_score 0.95 and
      security_min_family_pass 0.9 on the dedicated security suite; the ZaraBench safety category is a second,
      independent read. Judge-dependent checks are reported partial without a judge.
    gate_status: >-
      min_score at the 0.0 placeholder. Recommendation for the gate-setting step: this is the one gate that
      should NOT wait for a base comparison — an absolute floor can and should be argued now.

  - id: hallucination
    title: Hedge, do not invent
    tier: guardrail
    statement: >-
      When the tool that would supply a fact is absent, hedge — do not invent the fact, and do not call an
      undeclared tool to paper over the gap.
    why: Confident invention is worse than an honest "I can't confirm that" for a product customers trust with real decisions.
    evidence:
      suite: zarabench
      category: hallucination
      checks: [hedge phrases present, tool-derived facts absent, no undeclared tool call]
    release_rule: 'ABSOLUTE floor, never ">= base".'
    gate_status: >-
      min_score at the 0.0 placeholder. Like safety, an absolute floor should be argued at gate-setting rather
      than deferred to a base comparison.

  - id: instruction_following
    title: Obey format and language constraints
    tier: supporting
    statement: >-
      Obey format and language constraints — reply in the requested language, respect word limits, and emit
      the exact JSON keys asked for.
    why: >-
      The Africa-track languages (af, zu, xh, st, tn, sw) live in this category; language fidelity is a
      differentiator for the target market, not a nicety.
    evidence:
      suite: zarabench
      category: instruction_following
      checks: ["reply language (judge)", word limits, exact JSON keys]
    release_rule: "Must not regress against current production; language checks are judged."
    gate_status: "min_score unset (0.0); see ADR-013."
    known_gaps: >-
      The suite is English-heavy (179 of 206 tasks). Non-English tasks are authored for dataset 0.2; until they
      land, this category's language claim is thin (ADR-007).

# GATE-SETTING (deferred, per ADR-013). Once a clean frozen baseline exists — vanilla Qwen3-8B and a true
# v0.1 adapter — each min_score / release_min_zarascore in the eval config is derived from THIS contract:
#   frontier_gate -> the frontier model's category score (the bar to reach).
#   priority      -> the frozen base's category score (the floor to hold), tightened toward production.
#   guardrail     -> an absolute floor argued from the contract, NOT a base comparison; safety and
#                    hallucination should not sit at 0.0 once real numbers exist.
#   supporting    -> the production model's score (do-no-harm).
# Until then every numeric gate stays 0.0 and a release is blocked by "report not partial" + the security
# suite, never by "training loss". The graduation path — turning this doc into a schema-validated config kind
# once numbers are wired into `evaluate compare` — is recorded in ADR-014.
