[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protea"
version = "0.0.1"
description = "Protea — Moove Digital's proprietary model platform (data pipeline, training, evaluation, serving, routing)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Installed only where the work happens; the base package stays CPU-light.
pipeline = ["datasketch>=1.6", "detect-secrets>=1.5"]
eval = ["httpx>=0.27"]
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "trl>=0.9", "bitsandbytes>=0.43", "datasets>=2.20", "accelerate>=0.33", "mlflow>=2.14"]
serve = ["vllm>=0.6"]

[project.scripts]
protea = "protea.cli:app"

[tool.setuptools.packages.find]
include = ["protea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
