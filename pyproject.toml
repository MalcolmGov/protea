[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protea"
version = "0.0.1"
description = "Protea — Moove Digital's proprietary model platform (data pipeline, training, evaluation, serving, routing)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "anthropic>=0.40",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "fastapi>=0.115", "uvicorn>=0.30"]
# Installed only where the work happens; the base package stays CPU-light.
pipeline = ["datasketch>=1.6", "detect-secrets>=1.5"]
eval = ["httpx>=0.27"]
# CPU-capable training stack (install torch separately from the CPU or CUDA index that matches the machine).
train-cpu = ["transformers>=5.0", "peft>=0.18", "trl>=1.0", "datasets>=4.0", "accelerate>=1.5", "tokenizers>=0.22"]
train = ["protea[train-cpu]", "torch>=2.4", "bitsandbytes>=0.45", "mlflow>=2.14"]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
vllm = ["vllm>=0.6"]

[project.scripts]
protea = "protea.cli:app"
protea-storage = "protea.cli_storage:app"

[tool.setuptools.packages.find]
include = ["protea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Argument/Option in defaults is the framework idiom

[tool.ruff.lint.pycodestyle]
max-line-length = 150  # long string literals; the formatter still wraps code at 120
