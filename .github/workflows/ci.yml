name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: protea doctor
      - run: protea config validate configs
      - run: protea evaluate verify
      - name: Reference answers must satisfy every evaluator
        run: protea evaluate run --provider reference --out /tmp/zarabench-reports --label ci
      - name: ZaraBench 0.2 (content floors) is sealed and satisfiable
        run: |
          protea evaluate verify --config configs/evaluation/zarabench-0.2.yaml
          protea evaluate run --provider reference --config configs/evaluation/zarabench-0.2.yaml --out /tmp/zarabench-02 --label ci
      # 0.2 measures a stub at 47.9%; the ceiling is headroom, not a target. It fails if a check is loosened
      # back toward shape-only scoring (0.1.1 measured 62.1% with agent_generation fully satisfied by a stub).
      - name: The instrument floor cannot creep back up
        run: protea evaluate audit --config configs/evaluation/zarabench-0.2.yaml --max-zarascore 0.55
      - name: Security probe suite is sealed, deterministic and satisfiable
        run: |
          protea security verify
          protea security run --provider reference --out /tmp/security-reports --label ci
          protea security gate /tmp/security-reports/security-0.1/reference-reference-ci.json
      - name: Economic model renders from the committed inputs
        run: protea economics report --json > /tmp/economics.json
  train-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, wheels-only install of the verified CPU training stack (requirements/train-cpu.txt).
      - run: "pip install --only-binary :all: --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/train-cpu.txt"
      - name: Offline trainer smoke (tiny random model, checkpoint, resume, card, register)
        run: PYTHONPATH=. pytest -q tests/test_trainer_smoke.py
      - name: Remote job plans are dry-run only (fixture dataset; the real dataset is never in CI)
        run: |
          PYTHONPATH=. python -m protea.cli train remote --config configs/training/ci-smoke.yaml --remote configs/remote/runpod-a100.yaml --allow-unregistered --out /tmp/remote-plans
          PYTHONPATH=. python -m protea.cli train remote --config configs/training/ci-smoke.yaml --remote configs/remote/azure-nc24.yaml --allow-unregistered --out /tmp/remote-plans
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed secrets and key material
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)id_rsa$|\.safetensors$|\.gguf$' || true)"
          if [ -n "$hits" ]; then echo "Forbidden committed files:"; echo "$hits"; exit 1; fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
