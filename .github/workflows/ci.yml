name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: protea doctor
      - run: protea config validate configs
      - run: protea evaluate verify
      - name: Reference answers must satisfy every evaluator
        run: protea evaluate run --provider reference --out /tmp/zarabench-reports --label ci
  train-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train-cpu]"
      - name: Offline trainer smoke (tiny random model, checkpoint, resume, card, register)
        run: pytest -q tests/test_trainer_smoke.py
      - name: Remote job plans are dry-run only
        run: |
          protea train remote --config configs/training/protea-agent-8b-qlora.yaml --remote configs/remote/runpod-a100.yaml --allow-unregistered --out /tmp/remote-plans
          protea train remote --config configs/training/protea-agent-8b-qlora.yaml --remote configs/remote/azure-nc24.yaml --allow-unregistered --out /tmp/remote-plans
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed secrets and key material
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)id_rsa$|\.safetensors$|\.gguf$' || true)"
          if [ -n "$hits" ]; then echo "Forbidden committed files:"; echo "$hits"; exit 1; fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
