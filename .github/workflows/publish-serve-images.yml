name: Publish serving images

# Builds the two serving images and pushes them to GHCR:
#   deployment/protea/Dockerfile.infer   -> ghcr.io/malcolmgov/protea-infer   (vLLM engine, GPU)
#   deployment/protea/Dockerfile.facade  -> ghcr.io/malcolmgov/protea-facade  (auth + validation gate, CPU)
# Both bake protea/ and configs/, so dispatch this manually right before standing up a serving endpoint to ship
# the current code; it also auto-publishes when an image's own build inputs change on main. Deploy with
# deployment/protea/docker-compose.yml (see docs/inference.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deployment/protea/Dockerfile.infer
      - deployment/protea/Dockerfile.facade
      - deployment/protea/entrypoint-infer.sh
      - protea/serving/**
      - protea/cli_serve.py
      - configs/inference/**
      - configs/serve/**
      - requirements/serve.txt
      - .github/workflows/publish-serve-images.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/malcolmgov/protea-infer
            file: deployment/protea/Dockerfile.infer
          - image: ghcr.io/malcolmgov/protea-facade
            file: deployment/protea/Dockerfile.facade
    steps:
      - uses: actions/checkout@v4

      # The vLLM base image is large; reclaim runner disk before building (harmless for the slim facade).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
