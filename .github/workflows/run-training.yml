name: Run training (RunPod)

# One-click remote training. Set these repository secrets once
# (Settings → Secrets and variables → Actions → New repository secret):
#   RUNPOD_API_KEY        - your RunPod API key
#   HF_TOKEN              - your Hugging Face read token
#   R2_ACCESS_KEY_ID      - Cloudflare R2 access key id
#   R2_SECRET_ACCESS_KEY  - Cloudflare R2 secret access key
# Upload the training config's dataset files to R2 first (train_key / val_key below), then run this workflow
# (Actions → Run training (RunPod) → Run workflow). It defaults to a dry-run that rents nothing; choose
# "launch" to actually rent the GPU. The local dataset paths are read from the training config, so the same
# workflow launches 0.1, 0.2 (blended), or any future version — just point config/train_key/val_key at them.
on:
  workflow_dispatch:
    inputs:
      bucket:
        description: R2 bucket name (e.g. protea-runs)
        required: true
      endpoint:
        description: R2 S3 endpoint, e.g. https://<account-id>.r2.cloudflarestorage.com
        required: true
      config:
        description: Training config to run
        required: true
        default: configs/training/protea-agent-8b-qlora.yaml
      remote:
        description: Remote/GPU target (A100 is fastest but often supply-constrained; A6000/L40S are 48GB and easier to get)
        required: true
        default: configs/remote/runpod-a100.yaml
        type: choice
        options:
          - configs/remote/runpod-a100.yaml
          - configs/remote/runpod-a6000.yaml
          - configs/remote/runpod-l40s.yaml
      train_key:
        description: R2 key of the train split (matches the config's dataset.train)
        required: true
        default: train.jsonl
      val_key:
        description: R2 key of the validation split (matches the config's dataset.validation)
        required: true
        default: validation.jsonl
      confirm:
        description: dry-run prints the plan and cost only; launch rents an A100 (~USD 2-4)
        required: true
        default: dry-run
        type: choice
        options: [dry-run, launch]

permissions:
  contents: read

concurrency:
  group: run-training
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: ${{ inputs.endpoint }}
  AWS_DEFAULT_REGION: auto

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hash-pinned, wheels-only install (no setup-script execution, locked versions) — the launcher needs only
      # the base deps; protea itself is imported from source via PYTHONPATH.
      - run: "pip install --only-binary :all: --require-hashes -r requirements/base.txt"

      - name: Point the config at your R2 bucket and endpoint
        env:
          BUCKET: ${{ inputs.bucket }}
          ENDPOINT: ${{ inputs.endpoint }}
          REMOTE: ${{ inputs.remote }}
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          p = pathlib.Path(os.environ["REMOTE"])
          cfg = yaml.safe_load(p.read_text())
          cfg["storage"]["uri"] = f"s3://{os.environ['BUCKET']}"
          cfg["storage"]["endpoint"] = os.environ["ENDPOINT"]
          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          print(p.read_text())
          PY

      # The dataset is gitignored (proprietary; kept out of the public repo). We read the local paths the chosen
      # training config expects, then copy the R2 objects into exactly those paths — so train/validation land
      # where both `train remote` (for hashing) and the pod's entrypoint (after pull) look for them.
      - name: Fetch the dataset from R2 into the config's paths
        env:
          BUCKET: ${{ inputs.bucket }}
          CONFIG: ${{ inputs.config }}
          TRAIN_KEY: ${{ inputs.train_key }}
          VAL_KEY: ${{ inputs.val_key }}
        run: |
          TRAIN_DST=$(python -c "import yaml,sys; print(yaml.safe_load(open('$CONFIG'))['dataset']['train'])")
          VAL_DST=$(python -c "import yaml,sys; print(yaml.safe_load(open('$CONFIG'))['dataset']['validation'])")
          mkdir -p "$(dirname "$TRAIN_DST")" "$(dirname "$VAL_DST")"
          aws s3 cp "s3://${BUCKET}/${TRAIN_KEY}" "$TRAIN_DST"
          aws s3 cp "s3://${BUCKET}/${VAL_KEY}"   "$VAL_DST"
          echo "TRAIN_DST=$TRAIN_DST" >> "$GITHUB_ENV"
          echo "VAL_DST=$VAL_DST" >> "$GITHUB_ENV"

      # Put the dataset where the pod's entrypoint pulls it from (PROTEA_STORAGE/protea_data). Idempotent: if you
      # already uploaded the files under protea_data/… this just re-affirms them.
      - name: Seed the dataset for the pod
        if: ${{ inputs.confirm == 'launch' }}
        env:
          BUCKET: ${{ inputs.bucket }}
        run: aws s3 sync protea_data "s3://${BUCKET}/protea_data"

      - name: Plan (dry-run — rents nothing)
        if: ${{ inputs.confirm != 'launch' }}
        env:
          CONFIG: ${{ inputs.config }}
          REMOTE: ${{ inputs.remote }}
        run: |
          PYTHONPATH=. python -m protea.cli train remote \
            --config "$CONFIG" \
            --remote "$REMOTE" --allow-unregistered

      - name: Launch (rents the GPU)
        if: ${{ inputs.confirm == 'launch' }}
        env:
          CONFIG: ${{ inputs.config }}
          REMOTE: ${{ inputs.remote }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROTEA_STORAGE_CREDENTIALS: ${{ secrets.R2_ACCESS_KEY_ID }}:${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          PYTHONPATH=. python -m protea.cli train remote \
            --config "$CONFIG" \
            --remote "$REMOTE" --allow-unregistered --confirm
